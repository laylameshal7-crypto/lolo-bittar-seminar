<meta property="og:description" content="التناغم بين التصميم الجرافيكي والتصميم الداخلي · الثلاثاء ١٧ نوفمبر · ٤:٣٠ عصرًا">

<title>تسجيل جلسة لولو بتار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: terracotta session card with a landscape portrait, then one question per screen under a drawing of the studio that fills with every step */
:root{
  color-scheme:light;
  --terra:#9F4426;      /* session card, primary actions */
  --terra-2:#BE6731;
  --green:#545E45;      /* selection, details */
  --ink:#1F2D16;        /* text */
  --sand:#F5F0E6;       /* ground */
  --card:#FFFDF8;
  --line:#E2DACB;
  --muted:#77705F;
  --green-soft:#E9ECE1;
  --terra-soft:#F6E7DF;
  --font:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--sand)}
body{color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.8;direction:rtl}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:grid;gap:16px}

/* Session card */
.hero{background:var(--terra);color:#FFFDF8;border-radius:26px;padding:12px 12px 22px;display:grid;gap:16px}
.photo{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:4/3;max-width:100%;background:#3a2a22}
.photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 35%}
.photo span{position:absolute;inset-inline-start:12px;bottom:12px;background:rgba(255,253,248,.92);color:var(--terra);font-size:13px;font-weight:600;border-radius:99px;padding:3px 12px;direction:ltr}
.htext{display:grid;gap:10px;padding-inline:8px}
.kicker{font-size:13px;opacity:.88}
.hero h1{margin:0;font-size:clamp(22px,6vw,27px);font-weight:700;line-height:1.5;text-wrap:balance}
.hero h1 span{display:block;font-size:.66em;font-weight:500;opacity:.9;margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.meta div{border:1px solid rgba(255,253,248,.35);border-radius:99px;padding:3px 13px;font-size:14px}
.meta b{font-weight:600}
.meta .loc{display:inline-flex;align-items:center;gap:6px}
.meta .loc svg{flex:none}

/* Form card */
.panel{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:18px 18px 20px;display:grid;gap:16px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top b{font-weight:600;font-size:17px}
.top small{display:block;color:var(--muted);font-size:13px;line-height:1.5}
.counter{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.room{border-radius:18px;overflow:hidden;background:var(--sand)}
.room svg{display:block;width:100%;height:auto}
.ghost *{fill:none!important;stroke:#CFC6B4;stroke-width:1;stroke-dasharray:3 4}
.part{opacity:0;transform:translateY(6px);transition:opacity .6s ease,transform .7s cubic-bezier(.3,1.3,.5,1)}
.part.on{opacity:1;transform:none}
#lights{visibility:hidden}
#lights.on{visibility:visible}
#lights .cone{transform-box:view-box;transform:scaleY(0);opacity:0}
#lights .pool,#lights .halo{opacity:0}
#lights .halo{transform-box:fill-box;transform-origin:center}
#lights.on .halo{animation:hon .5s ease-out var(--d) forwards,hpulse 5s ease-in-out calc(var(--d) + 1.6s) infinite}
#lights.on .cone{animation:pour 1.3s cubic-bezier(.2,.75,.25,1) calc(var(--d) + .15s) forwards,breathe 5s ease-in-out calc(var(--d) + 1.6s) infinite}
#lights.on .pool{animation:land .9s ease-out calc(var(--d) + .9s) forwards,breathe 5s ease-in-out calc(var(--d) + 1.6s) infinite}
@keyframes hon{0%{opacity:0}35%{opacity:1}50%{opacity:.4}100%{opacity:1}}
@keyframes hpulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.85);opacity:.5}}
@keyframes pour{0%{transform:scaleY(0);opacity:0}25%{opacity:1}100%{transform:scaleY(1);opacity:1}}
@keyframes land{from{opacity:0}to{opacity:1}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.4}}
.capbar{display:flex;align-items:center;gap:10px;padding:10px 12px}
.cap{font-size:12px;color:var(--muted);flex:none;min-width:0}
.bar{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--terra);transition:width .6s ease}

.step{display:grid;gap:12px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.step h2{margin:0;font-size:20px;font-weight:600;line-height:1.6;text-wrap:balance}
.opt{font-size:12px;font-weight:500;color:var(--green);background:var(--green-soft);border-radius:99px;padding:1px 10px;margin-inline-start:6px;vertical-align:middle}
.hint{margin:-6px 0 0;color:var(--muted);font-size:14px}
input[type=text],input[type=tel],input[type=email],textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;transition:border-color .2s,box-shadow .2s}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.ltr{direction:ltr;text-align:right}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.65}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices label{position:relative;cursor:pointer}
.choices input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.choices span{display:grid;gap:2px;justify-items:center;border:1.5px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;transition:.2s}
.choices span small{font-size:12px;color:var(--muted)}
.choices input:checked+span{border-color:var(--green);background:var(--green-soft);font-weight:600}
.choices input:focus-visible+span{box-shadow:0 0 0 4px var(--green-soft)}
.err{color:var(--terra);font-size:13px;margin:0}
.err:empty{display:none}

.nav{display:flex;gap:10px;align-items:center}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:14px;padding:12px 22px;cursor:pointer;border:1.5px solid var(--terra);background:var(--terra);color:#FFFDF8}
.btn:disabled{opacity:.6;cursor:wait}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--line);font-weight:500}
.btn.link{background:none;border:0;color:var(--muted);padding:12px 6px;font-weight:500}
.btn:focus-visible{outline:3px solid var(--green);outline-offset:3px}
.nav .btn:first-child{flex:1}

.intro{display:grid;gap:12px}
.intro p{margin:0;color:var(--muted)}

.done{display:grid;gap:10px;text-align:center;padding:6px 4px 2px;animation:in .4s ease}
.done .seal{justify-self:center;width:54px;height:54px;border-radius:50%;background:var(--green-soft);display:grid;place-items:center}
.done h2{margin:0;font-size:23px;color:var(--terra)}
.done p{margin:0;color:var(--muted);text-wrap:balance}
.done .when{color:var(--ink);font-weight:600}
.maplink{justify-self:center;display:inline-flex;align-items:center;gap:8px;margin-top:8px;padding:11px 20px;border-radius:14px;border:1.5px solid var(--terra);background:var(--terra);color:#FFFDF8;font-weight:600;font-size:15px;text-decoration:none}
.maplink:focus-visible{outline:3px solid var(--green);outline-offset:3px}
.draft{font-size:12px;color:var(--muted);text-align:center;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>

const NS='http://www.w3.org/2000/svg';

function chair(x,y,s,dir){
  const g=document.createElementNS(NS,'g');

  g.innerHTML=`<ellipse cx="0" cy="15" rx="13" ry="2.6" fill="#6B2D17" opacity=".45"/>

  return g;

function render(){
  parts.forEach((p,i)=>p.classList.toggle('on',i<reached));

}

let cur=-1;
function show(i){
  cur=i;stage.textContent='';
  counter.textContent=(i>=0&&i<N)?`${ar(i+1)} / ${ar(N)}`:'';
  cap.textContent=(i>=0&&i<N)?'التالي: '+Q[i].cap:(i<0?'المكان بانتظارك':'');
  if(i<0){stage.append(document.getElementById('intro').content.cloneNode(true));stage.querySelector('[data-act=start]').onclick=()=>show(0);return}
  if(i>=N)return done();
  const q=Q[i];
  const s=el(`<section class="step"><h2><span class="qt">${q.q}</span>${q.req?'':' <span class="opt">اختياري</span>'}</h2><div class="field"></div><p class="err"></p><div class="nav"></div></section>`);
  const f=s.querySelector('.field');
  if(q.t==='radio'){
    const w=document.createElement('div');w.className='choices';
    q.o.forEach(([o,sub],j)=>{
      const lab=el(`<label><input type="radio" name="${q.k}" id="${q.k}${j}" value="${o}"><span>${o}<small>${sub}</small></span></label>`);
      const inp=lab.querySelector('input');inp.checked=A[q.k]===o;
      inp.onchange=()=>{A[q.k]=o;touch();setTimeout(()=>go(1),380)};
      w.append(lab);
    });f.append(w);
  }else{
    const inp=document.createElement(q.t==='area'?'textarea':'input');
    if(q.t!=='area')inp.type=q.t;inp.id='f_'+q.k;inp.value=A[q.k]||'';
    if(q.ph)inp.placeholder=q.ph;if(q.ltr)inp.className='ltr';
    inp.oninput=()=>{A[q.k]=inp.value;touch()};
    inp.onpointerdown=touch;
    if(q.t!=='area')inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go(1)}};
    f.append(inp);setTimeout(()=>inp.focus({preventScroll:true}),60);
  }
  const nav=s.querySelector('.nav');
  const next=el(`<button class="btn" type="button">${i===N-1?'تسجيل الحضور':'التالي'}</button>`);next.onclick=()=>go(1);
  nav.append(next);
  if(i>0){const back=el(`<button class="btn sec" type="button">السابق</button>`);back.onclick=()=>show(i-1);nav.append(back)}
  if(!q.req){const sk=el(`<button class="btn link" type="button">تخطي</button>`);sk.onclick=()=>go(1,true);nav.append(sk)}
  stage.append(s);
}
function touch(){if(cur>=0&&cur<N&&reached<cur+1){reached=cur+1;render()}}
function go(d,skip){
  const q=Q[cur];
  if(d>0&&q.req&&!has(q)){stage.querySelector('.err').textContent=q.t==='radio'?'اختر طريقة الحضور':'اكتب اسمك للمتابعة';return}
  if(d>0){if(skip)A[q.k]='';reached=Math.max(reached,cur+1);render()}
  if(d>0&&cur===N-1)return submit();
  show(cur+d);
}
let sending=false;
async function submit(){
  if(sending)return;
  const err=stage.querySelector('.err'),btn=stage.querySelector('.nav .btn');
  if(!SHEET_URL){done();return}
  sending=true;err.textContent='';btn.disabled=true;btn.textContent='جارٍ الإرسال...';
  let ig=String(A.ig||'').trim();if(ig&&!ig.startsWith('@'))ig='@'+ig;
  const data={name:A.name||'',phone:A.phone||'',email:A.email||'',att:A.att||'',ig,interest:A.interest||''};
  try{
    await fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)});
    sending=false;done();
  }catch(e){
    sending=false;btn.disabled=false;btn.textContent='تسجيل الحضور';
    err.textContent='تعذّر الإرسال، تأكد من اتصالك بالإنترنت وحاول مرة ثانية.';
  }
}
function done(){
  reached=N;render();room.classList.add('lit');document.getElementById('lights').classList.add('on');counter.textContent='';cap.textContent='اكتملت الجلسة';
  const online=A.att==='أونلاين';
  const first=String(A.name||'').trim().split(/\s+/)[0];
  const s=el(`<section class="done">
    <div class="seal"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#545E45" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2></h2>
    <p class="when">الثلاثاء ١٧ نوفمبر · ٤:٣٠ عصرًا</p>
    <p></p></section>`);
  s.querySelector('h2').textContent=(online?'تسجيلك أونلاين مؤكد':'مقعدك بانتظارك')+(first?'، '+first:'');
  s.querySelector('p:last-of-type').textContent=online?'بتحضر الجلسة أونلاين عن بُعد، ويصلك رابط الدخول قبل موعدها. نلقاك في حوار يجمع الجرافيك بالمساحة.':'جهّزنا لك مكانًا في الجلسة. نلقاك في The Artist Station لحوار يجمع الجرافيك بالمساحة.';
  const again=el(`<div class="nav" style="justify-content:center;margin-top:6px"><button class="btn link" type="button" id="again">تسجيل شخص آخر</button></div>`);
  if(!online){s.append(el(`<a class="maplink" href="https://maps.google.com/?q=26.250231,50.608669" target="_blank" rel="noopener"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>الموقع على الخريطة</a>`))}
  again.querySelector('button').onclick=restart;s.append(again);
  if(online)s.querySelector('.when').textContent='الثلاثاء ١٧ نوفمبر · ٤:٣٠ عصرًا · أونلاين';
  stage.textContent='';stage.append(s);
}
function restart(){
  document.getElementById('lights').classList.remove('on');
  Object.keys(A).forEach(k=>delete A[k]);reached=0;room.classList.remove('lit');render();show(-1);
}
render();show(-1);
</script>

</body>
